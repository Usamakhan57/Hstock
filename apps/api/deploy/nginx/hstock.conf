# HStock — Nginx reverse proxy template (Hostinger Ubuntu VPS)
# Copy to /etc/nginx/sites-available/hstock and enable with:
#   sudo ln -s /etc/nginx/sites-available/hstock /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace SSL certificate paths with Certbot / Hostinger paths.

upstream hstock_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hstock.store www.hstock.store;

    # Redirect HTTP → HTTPS (enable after certificates exist)
    # return 301 https://$host$request_uri;

    # Temporary HTTP-only bootstrap (remove once TLS is active)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://hstock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://hstock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static build (apps/web) — adjust root to deployed dist path
    location / {
        root /var/www/hstock/web;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hstock.store www.hstock.store;

    # ssl_certificate     /etc/letsencrypt/live/hstock.store/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hstock.store/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://hstock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Cryptomus webhooks will hit /api/v1/... in Phase 2+
    location /health {
        proxy_pass http://hstock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/hstock/web;
        try_files $uri $uri/ /index.html;
    }
}
